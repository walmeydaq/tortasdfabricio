name: CI-CD Registro de clientes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integracion:
    name: CI - pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Preparar Google Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Generar build
        run: npm run build -- --base-href /

      - name: Guardar el build compilado
        uses: actions/upload-artifact@v6
        with:
          name: angular-build
          path: dist/tortasdfabricio/browser
          if-no-files-found: error

  entrega:
    name: CD - despliegue FTP
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el build compilado
        uses: actions/download-artifact@v7
        with:
          name: angular-build
          path: dist/tortasdfabricio/browser

      - name: Desplegar al servidor por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/tortasdfabricio/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
